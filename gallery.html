<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>Astro Interior Design Portfolio — Luxury Transformations & Before-After Projects | AstroInterior</title>
  <meta name="description" content="Explore 500+ luxury astro-aligned design transformations: residential interiors, corporate offices, hospitality spaces, and before-after room projects by Richa Agarwal. View our astro interior design gallery.">
  <meta name="keywords" content="astro interior design portfolio, luxury interior design gallery, before after home design, vastu design transformations, richa agarwal projects, astro aligned interiors, birth chart room design gallery">
  <meta name="author" content="Richa Agarwal">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <link rel="canonical" href="https://www.astrointerior.in/gallery.html">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AstroInterior">
  <meta property="og:title" content="Astro Interior Design Portfolio — 500+ Luxury Transformations">
  <meta property="og:description" content="Explore luxury astro-aligned design transformations: residential interiors, corporate offices, and hospitality spaces by Richa Agarwal.">
  <meta property="og:url" content="https://www.astrointerior.in/gallery.html">
  <meta property="og:image" content="https://www.astrointerior.in/assets/portfolio_apartment_living.jpg">
  <meta property="og:locale" content="en_IN">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Astro Interior Design Portfolio — 500+ Luxury Transformations">
  <meta name="twitter:description" content="Luxury astro-aligned design transformations by Richa Agarwal. Residential, corporate & hospitality projects.">
  <meta name="twitter:image" content="https://www.astrointerior.in/assets/portfolio_apartment_living.jpg">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

  <!-- JSON-LD Structured Data: ImageGallery -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageGallery",
    "name": "AstroInterior Design Portfolio",
    "description": "500+ luxury astro-aligned design transformations including residential interiors, corporate offices, and hospitality spaces.",
    "url": "https://www.astrointerior.in/gallery.html",
    "isPartOf": {"@id": "https://www.astrointerior.in/#website"},
    "creator": {"@id": "https://www.astrointerior.in/#founder"},
    "breadcrumb": {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.astrointerior.in/"},
        {"@type": "ListItem", "position": 2, "name": "Design Gallery", "item": "https://www.astrointerior.in/gallery.html"}
      ]
    },
    "inLanguage": "en-IN"
  }
  </script>

  <style>
    /* Custom Styling for Premium Gallery */
    :root {
      --font-display: 'Playfair Display', serif;
      --font-body: 'Inter', sans-serif;
      --c-dark: #1E1E1E;
      --c-gold: #C8A15A;
      --c-gold-glow: rgba(200, 161, 90, 0.08);
      --c-border: rgba(200, 161, 90, 0.15);
    }

    body {
      background-color: #FAF8F4;
      font-family: var(--font-body);
      color: #333333;
      overflow-x: hidden;
    }

    /* Hero Banner */
    .gallery-hero {
      padding: 10rem 2rem 5rem;
      text-align: center;
      background: linear-gradient(180deg, #1E1E1E 0%, #2A2A2A 100%);
      color: #FFFFFF;
      position: relative;
    }

    .gallery-hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4rem;
      background: linear-gradient(0deg, #FAF8F4 0%, transparent 100%);
    }

    .gallery-hero h1 {
      font-family: var(--font-display);
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #FFFFFF;
    }

    .gallery-hero p {
      font-size: 1.1rem;
      color: #BDBDBD;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
      font-weight: 300;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: -2rem auto 4rem;
      position: relative;
      z-index: 10;
      flex-wrap: wrap;
      max-width: 800px;
      padding: 0 1rem;
    }

    .filter-btn {
      padding: 0.8rem 1.8rem;
      border: 1px solid var(--c-border);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--c-dark);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .filter-btn:hover {
      border-color: var(--c-gold);
      transform: translateY(-2px);
    }

    .filter-btn.active {
      background: var(--c-dark);
      color: #FFFFFF;
      border-color: var(--c-dark);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* Gallery Grid */
    .collections-grid {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 2rem 8rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2.5rem;
    }

    /* Collection Card */
    .collection-card {
      background: #FFFFFF;
      border: 1px solid var(--c-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .collection-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(200, 161, 90, 0.1), 0 8px 16px rgba(0, 0, 0, 0.04);
      border-color: rgba(200, 161, 90, 0.3);
    }

    .card-img-wrap {
      position: relative;
      padding-top: 65%; /* 16:10 aspect ratio */
      overflow: hidden;
      background: #EAEAEA;
    }

    .card-img-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .collection-card:hover .card-img-wrap img {
      transform: scale(1.05);
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 2rem 1.5rem 1rem;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .card-count-badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--c-dark);
      letter-spacing: 0.02em;
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--c-gold);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--c-dark);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .card-link {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--c-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      transition: color 0.3s;
    }

    .collection-card:hover .card-link {
      color: var(--c-gold);
    }

    .card-link::after {
      content: '→';
      transition: transform 0.3s;
    }

    .collection-card:hover .card-link::after {
      transform: translateX(5px);
    }

    /* Back Home Button */
    .back-home-header {
      position: absolute;
      top: 2rem;
      left: 2rem;
      z-index: 100;
    }

    .btn-back-home {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.6rem 1.2rem;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .btn-back-home:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateX(-3px);
    }

    /* Custom Lightbox Overhaul */
    .gallery-lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 15, 0.98);
      z-index: 2000;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      flex-direction: column;
    }

    .gallery-lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      color: #FFFFFF;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lightbox-topbar h3 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .lightbox-close-btn {
      background: none;
      border: none;
      color: #FFFFFF;
      font-size: 2.2rem;
      cursor: pointer;
      padding: 0 10px;
      transition: color 0.3s;
    }

    .lightbox-close-btn:hover {
      color: var(--c-gold);
    }

    .lightbox-main {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem;
    }

    .lightbox-img-container {
      max-width: 85%;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .lightbox-img-container img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Lightbox Nav Buttons */
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 100;
    }

    .lb-nav:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--c-gold);
      color: var(--c-gold);
    }

    .lb-prev { left: 2.5rem; }
    .lb-next { right: 2.5rem; }

    /* Lightbox Bottom Info & Thumbnails */
    .lightbox-bottom {
      background: rgba(20, 20, 20, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.5rem 2.5rem;
      backdrop-filter: blur(12px);
    }

    .lightbox-info {
      text-align: center;
      color: #BDBDBD;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }

    .lightbox-thumbs-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      overflow-x: auto;
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 5px;
    }

    .lightbox-thumb {
      width: 60px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.4;
      border: 1px solid transparent;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .lightbox-thumb.active {
      opacity: 1;
      border-color: var(--c-gold);
      transform: scale(1.05);
    }

    /* Minimal Responsive Adaptations */
    @media (max-width: 768px) {
      .gallery-hero h1 { font-size: 2.4rem; }
      .lb-nav { width: 44px; height: 44px; }
      .lb-prev { left: 1rem; }
      .lb-next { right: 1rem; }
      .lightbox-topbar { padding: 1rem 1.5rem; }
      .lightbox-bottom { padding: 1rem 1.5rem; }
      .collections-grid { grid-template-columns: 1fr; padding: 0 1rem 5rem; }
    }
  </style>
</head>
<body>

  <!-- Back to Home -->
  <div class="back-home-header">
    <a href="index.html#portfolio" class="btn-back-home">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>
  </div>

  <!-- Hero Header -->
  <header class="gallery-hero">
    <h1 class="hero-anim">Our Transformations</h1>
    <p class="hero-anim">Mergening Vedic geometry & directional orientation with bespoke luxury architecture to curate healthy, balanced, and prosperous spaces.</p>
  </header>

  <!-- Category Filter Bar -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All Projects</button>
    <button class="filter-btn" data-filter="residences">Residences</button>
    <button class="filter-btn" data-filter="hospitality">Hospitality & Wellness</button>
    <button class="filter-btn" data-filter="offices">Corporate Offices</button>
  </div>

  <!-- Collections Grid Layout -->
  <main class="collections-grid" id="collections-container">
    <!-- Dynamic Content Loaded by JS -->
  </main>

  <!-- Custom Lightbox Overlay -->
  <div class="gallery-lightbox" id="gallery-lightbox">
    <!-- Topbar -->
    <div class="lightbox-topbar">
      <h3 id="lb-title">Project Name</h3>
      <button class="lightbox-close-btn" id="lb-close" aria-label="Close gallery">&times;</button>
    </div>

    <!-- Main View -->
    <div class="lightbox-main">
      <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous image">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      
      <div class="lightbox-img-container">
        <img src="" alt="" id="lb-main-img">
      </div>

      <button class="lb-nav lb-next" id="lb-next" aria-label="Next image">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>

    <!-- Bottombar with Info & Thumbnails -->
    <div class="lightbox-bottom">
      <div class="lightbox-info">
        Image <span id="lb-current-index">1</span> of <span id="lb-total-count">1</span>
      </div>
      <div class="lightbox-thumbs-container" id="lb-thumbs">
        <!-- Thumbnail strip loaded dynamically -->
      </div>
    </div>
  </div>

  <!-- Manifest Loading and Dynamic Rendering JS -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let activeCollection = null;
      let activeImageIndex = 0;
      let manifestData = [];

      // Fetch dynamic manifest from server
      fetch('assets/gallery-manifest.json')
        .then(res => res.json())
        .then(data => {
          manifestData = data;
          renderCollections(data);
          initGSAP();
        })
        .catch(err => {
          console.error("Failed to load gallery manifest, falling back to static database representation", err);
        });

      // Render collections onto the DOM grid
      const container = document.getElementById('collections-container');
      
      function renderCollections(collections) {
        container.innerHTML = '';
        collections.forEach(col => {
          const card = document.createElement('div');
          card.className = `collection-card`;
          card.dataset.category = col.category;
          card.dataset.id = col.id;
          
          let displayCategory = col.category === 'residences' ? 'Residence' : 
                                col.category === 'hospitality' ? 'Hospitality & Wellness' : 'Corporate Office';

          card.innerHTML = `
            <div class="card-img-wrap">
              <img src="${col.cover}" alt="${col.title}" loading="lazy">
              <div class="card-overlay">
                <span class="card-count-badge">${col.images.length} Images</span>
              </div>
            </div>
            <div class="card-content">
              <span class="card-category">${displayCategory}</span>
              <h2 class="card-title">${col.title}</h2>
              <span class="card-link">Explore Collection</span>
            </div>
          `;
          
          card.addEventListener('click', () => openLightbox(col.id));
          container.appendChild(card);
        });
      }

      // Filter handling
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filter = btn.getAttribute('data-filter');

          const cards = document.querySelectorAll('.collection-card');
          cards.forEach(card => {
            if (filter === 'all' || card.dataset.category === filter) {
              card.style.display = 'flex';
              gsap.fromTo(card, {opacity: 0, scale: 0.95}, {opacity: 1, scale: 1, duration: 0.4});
            } else {
              card.style.display = 'none';
            }
          });
        });
      });

      // Lightbox Operations
      const lightbox = document.getElementById('gallery-lightbox');
      const mainImg = document.getElementById('lb-main-img');
      const titleEl = document.getElementById('lb-title');
      const currentIndexEl = document.getElementById('lb-current-index');
      const totalCountEl = document.getElementById('lb-total-count');
      const thumbsContainer = document.getElementById('lb-thumbs');

      function openLightbox(collectionId) {
        activeCollection = manifestData.find(c => c.id === collectionId);
        if (!activeCollection) return;

        activeImageIndex = 0;
        titleEl.textContent = activeCollection.title;
        totalCountEl.textContent = activeCollection.images.length;
        
        // Build thumbnails
        thumbsContainer.innerHTML = '';
        activeCollection.images.forEach((imgSrc, idx) => {
          const thumb = document.createElement('img');
          thumb.src = imgSrc;
          thumb.className = 'lightbox-thumb';
          thumb.addEventListener('click', () => selectImage(idx));
          thumbsContainer.appendChild(thumb);
        });

        selectImage(0);
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function selectImage(index) {
        if (!activeCollection) return;
        activeImageIndex = index;
        
        // Update main image with fade animation
        gsap.to(mainImg, {opacity: 0, scale: 0.97, duration: 0.2, onComplete: () => {
          mainImg.src = activeCollection.images[activeImageIndex];
          mainImg.onload = () => {
            gsap.to(mainImg, {opacity: 1, scale: 1, duration: 0.3});
          };
        }});

        currentIndexEl.textContent = index + 1;

        // Update thumbnails status
        const thumbs = thumbsContainer.querySelectorAll('.lightbox-thumb');
        thumbs.forEach((t, idx) => {
          if (idx === index) {
            t.classList.add('active');
            t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          } else {
            t.classList.remove('active');
          }
        });
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }

      function prevImage() {
        if (!activeCollection) return;
        let newIdx = activeImageIndex - 1;
        if (newIdx < 0) newIdx = activeCollection.images.length - 1;
        selectImage(newIdx);
      }

      function nextImage() {
        if (!activeCollection) return;
        let newIdx = (activeImageIndex + 1) % activeCollection.images.length;
        selectImage(newIdx);
      }

      document.getElementById('lb-close').addEventListener('click', closeLightbox);
      document.getElementById('lb-prev').addEventListener('click', prevImage);
      document.getElementById('lb-next').addEventListener('click', nextImage);

      // Keyboard support
      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
      });

      // Swipe support
      let touchStartX = 0;
      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      lightbox.addEventListener('touchend', (e) => {
        const diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) nextImage();
          else prevImage();
        }
      }, { passive: true });

      // GSAP Entrance
      function initGSAP() {
        if (typeof gsap === 'undefined') return;
        gsap.fromTo('.hero-anim', 
          {opacity: 0, y: 30}, 
          {opacity: 1, y: 0, duration: 0.8, stagger: 0.2, ease: 'power2.out'}
        );
        gsap.fromTo('.collection-card', 
          {opacity: 0, y: 40}, 
          {opacity: 1, y: 0, duration: 0.8, stagger: 0.1, ease: 'power2.out', delay: 0.3}
        );
      }
    });
  </script>
</body>
</html>
